name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare curated static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp \
            .nojekyll \
            about-tezzeta.jpg \
            app.js \
            data.js \
            i18n.js \
            index.html \
            platform-core.js \
            styles.css \
            _site/

          expected="$(
            printf '%s\n' \
              .nojekyll \
              about-tezzeta.jpg \
              app.js \
              data.js \
              i18n.js \
              index.html \
              platform-core.js \
              styles.css |
              LC_ALL=C sort
          )"
          actual="$(find _site -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$actual" = "$expected"

          (
            cd _site
            sha256sum \
              .nojekyll \
              about-tezzeta.jpg \
              app.js \
              data.js \
              i18n.js \
              index.html \
              platform-core.js \
              styles.css |
              tee SHA256SUMS
          )

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Report artifact evidence
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          {
            echo "### Pages artifact"
            echo
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Curated directory: \`_site\`"
            echo "- File manifest:"
            echo
            echo '```text'
            cat _site/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
